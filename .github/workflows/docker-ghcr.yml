name: Docker GHCR

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase required by GHCR)
        run: |
          OWNER_REPO="${{ github.repository }}"
          IMAGE_NAME="${REGISTRY}/$(echo "${OWNER_REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "Image: ${IMAGE_NAME}"

      - name: Set platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORMS="${{ inputs.platforms }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            PLATFORMS="linux/amd64,linux/arm64"
          else
            PLATFORMS="linux/amd64"
          fi
          echo "value=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "Platforms: ${PLATFORMS}"

      - name: Set up QEMU
        if: contains(steps.platforms.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "## Docker image pushed"
            echo ""
            echo "**Registry:** \`${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "### Pull example"
            echo '```bash'
            echo "docker pull ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA:0:7}"
            echo "docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
            echo '```'
            echo ""
            echo "> First push packages are private by default. Make it public under GitHub Packages if needed."
          } >> "$GITHUB_STEP_SUMMARY"
