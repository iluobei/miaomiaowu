<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      左上角品牌(标题 + logo)的首屏注入点。与标签页标题/favicon 是不同字段:
      那两个管浏览器标签页,这两个管页面左上角。服务端把占位符换成管理员设置的值,
      没设就留空,前端(lib/use-branding.ts)据此画第一帧,不用等 /api/branding 回来再跳变。
      Vite 开发服务器不经过 Go 的注入,content 会原样留着 __XXX__ 占位符,读取侧据此忽略。
      标签页标题与 favicon 没有占位符:构建期 scripts/inject-site-config.js 会按 site.json 重写它们,
      运行时由 internal/web/handler.go 按标签直接替换。
    -->
    <meta name="brand-title" content="__MMW_BRAND_TITLE__" />
    <meta name="brand-logo" content="__MMW_BRAND_LOGO__" />

    <!-- Primary Meta Tags -->
    <title>妙妙屋</title>
    <meta name="title" content="妙妙屋" />
    <meta name="description" content="妙妙屋 By miaomiaowu.net" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://miaomiaowu.net" />
    <meta property="og:title" content="妙妙屋" />
    <meta property="og:description" content="妙妙屋 By miaomiaowu.net" />
    <meta property="og:image" content="./images/preview.png" />

    <!-- Twitter -->
    <meta
      property="twitter:card"
      content="https://miaomiaowu.net/images/preview.png"
    />
    <meta property="twitter:url" content="https://miaomiaowu.net" />
    <meta property="twitter:title" content="妙妙屋" />
    <meta property="twitter:description" content="妙妙屋 By miaomiaowu.net" />
    <meta property="twitter:image" content="./safari-pinned-tab.svg" />

    <meta name="theme-color" content="#fff" />
    <script
      async
      defer
      src="https://in.miaomiaowu.net/script.js"
      data-website-id="6972d2b9-23de-4053-8e5b-d75970cae2bf"
    ></script>

    <!--
      面板壁纸/玻璃色调注入点:服务端把下面这个占位符换成一段 CSS 变量声明
      (--g-dim / --g-wallpaper / 自定义色调),没配置就留空。放 <head>:它只发变量、不发规则,
      变量要在应用样式表求值之前就位。见 internal/web/handler.go。
    -->
    <style id="mmw-panel-wallpaper">__MMW_PANEL_WALLPAPER__</style>
  </head>

  <body>
    <!--
      自定义 CSS 注入点。服务端把 __MMW_CUSTOM_CSS__ 替换成管理员配置的样式,没配置就留空。
      放在 <body> 开头而不是 <head> 里:Vite 把应用样式表插在 </head> 之前,注入点在 head 里
      会被应用样式压过去,管理员得给每条规则都写 !important。
    -->
    <style id="mmw-custom-css">__MMW_CUSTOM_CSS__</style>
    <script>
      ;(function () {
        var c = document.cookie.match(/(?:^|; )mmw-theme-style=([^;]*)/)
        var v = c ? c[1] : ''
        if (v === 'flat') {
          document.documentElement.classList.add('theme-flat')
        } else if (v === 'anime') {
          document.documentElement.classList.add('theme-anime')
          // 只换内置图标;管理员自定义的 favicon(服务端注入)不动。
          var f = document.querySelector("link[rel~='icon']")
          if (f && (f.getAttribute('href') || '').indexOf('images/favicon.ico') !== -1)
            f.href = '/images/anime-favicon.png'
        } else if (v === 'glass') {
          document.documentElement.classList.add('theme-glass')
        }
        // 玻璃主题的色调与「降低透明度」是 data 属性(与明暗/主题正交),首屏就要就位,
        // 否则会先按默认色调渲染一帧再跳变。值由服务端注入(见 internal/web/handler.go);
        // dev 模式占位符不被替换,indexOf 守卫会跳过。
        var tone = '__MMW_GLASS_TONE__'
        if (tone && tone.indexOf('__MMW_') !== 0)
          document.documentElement.setAttribute('data-glass-tone', tone)
        var rt = '__MMW_REDUCE_TRANSPARENCY__'
        if (rt === 'true')
          document.documentElement.setAttribute('data-glass-reduce', 'true')
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
